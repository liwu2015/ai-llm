spring.application.name=ai-llm

#spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY}
spring.ai.deepseek.api-key=sk-9d8b0a19dc974404a764a265fe30a7f0
spring.ai.deepseek.base-url=https://api.deepseek.com
spring.ai.deepseek.chat.model=deepseek-chat
spring.ai.deepseek.chat.temperature=0.7


langchain4j.chat.timeout-seconds=60
langchain4j.chat.log-requests=false
langchain4j.chat.log-responses=false

# MySQL Druid数据源
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/collection_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root

# Druid连接池配置
spring.datasource.druid.initial-size=5
spring.datasource.druid.max-active=20

# MyBatis配置
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.liwu.aillm
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
